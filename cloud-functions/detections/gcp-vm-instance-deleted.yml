title: GCP VM Instance Deleted
id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
status: experimental
description: Detects deletion of a GCP Compute Engine VM instance which may indicate infrastructure destruction or attacker cleanup
author: Himanshu
date: 2026/07/08
logsource:
    category: cloud
    product: gcp
    service: audit
detection:
    selection:
        action|contains: 'compute.instances.delete'
    condition: selection
falsepositives:
    - Legitimate infrastructure teardown
    - Automated scaling or CI/CD pipelines
level: medium
tags:
    - attack.impact
    - attack.t1485
fields:
    - actor
    - action
    - resource
    - source_ip
