title: GCP IAM Policy Modified
id: b2c3d4e5-f6a7-8901-bcde-f12345678901
status: experimental
description: Detects IAM policy changes in GCP which may indicate privilege escalation or unauthorized access grants
author: Himanshu
date: 2026/07/08
logsource:
    category: cloud
    product: gcp
    service: audit
detection:
    selection:
        action|contains: 'setIamPolicy'
    condition: selection
falsepositives:
    - Legitimate IAM administration
    - Automated deployment pipelines
level: high
tags:
    - attack.privilege_escalation
    - attack.t1078
fields:
    - actor
    - action
    - resource
    - source_ip
