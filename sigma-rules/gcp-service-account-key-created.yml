title: GCP Service Account Key Created
id: d4e5f6a7-b8c9-0123-defa-234567890123
status: experimental
description: Detects creation of a GCP service account key which may indicate persistence or credential theft by an attacker
author: Himanshu
date: 2026/07/08
logsource:
    category: cloud
    product: gcp
    service: audit
detection:
    selection:
        action|contains: 'CreateServiceAccountKey'
    condition: selection
falsepositives:
    - Legitimate service account key rotation
    - Automated deployment pipelines
level: high
tags:
    - attack.persistence
    - attack.t1098.001
fields:
    - actor
    - action
    - resource
    - source_ip
